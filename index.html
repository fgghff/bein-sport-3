<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل الفيديو داخل المتصفح</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .video-container {
            text-align: center;
        }
        video {
            width: 80%;
            max-width: 800px;
            border: 2px solid #fff;
            border-radius: 10px;
        }
        .play-button {
            margin-top: 20px;
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .play-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="videoPlayer" controls>
            <source src="https://cdnv.russiatoday.com/media/vids/2026.06/6a3846ed4c59b712426a5b6b.mp4" type="video/mp4">
            <!-- قم باستبدال الرابط أعلاه برابط الفيديو الذي ترغب في تشغيله -->
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
        <button class="play-button" onclick="playVideo()">تشغيل الفيديو</button>
    </div>

    <script>
        function playVideo() {
            const video = document.getElementById('videoPlayer');
            video.play();
        }
    </script>
</body>
</html>
